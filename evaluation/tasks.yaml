  - scenario: verification
    variant: verification_level_1_nvidia_single_adjustment
    question: >
      Verification level 1: single add-back adjustment.
      Use local document search/window tools to verify Nvidia's 2026 10-K evidence.
      Internally track extracted raw values and formulas, but return only the final JSON.

      A junior analyst produced this draft JSON:
      {"nvidia_revenue_2026_millions": 215938.000, "nvidia_operating_income_2026_millions": 130387.000,
      "nvidia_h20_charge_millions": 4500.000, "nvidia_adjusted_operating_income_millions": 125887.000,
      "nvidia_reported_operating_margin_pct": 60.382, "nvidia_adjusted_operating_margin_pct": 58.295,
      "nvidia_h20_adjustment_pp": -2.087}

      Verify the draft against the 10-K and correct it if needed.
      The H20 charge was an operating charge. For the adjusted operating margin, add back the H20 charge to reported
      operating income, then divide by revenue:
      adjusted operating margin = (reported operating income + H20 charge) / revenue * 100.
      Adjustment in percentage points = adjusted operating margin minus reported operating margin.

      Return ONLY a valid JSON object with exact keys:
      "nvidia_revenue_2026_millions", "nvidia_operating_income_2026_millions",
      "nvidia_h20_charge_millions", "nvidia_adjusted_operating_income_millions",
      "nvidia_reported_operating_margin_pct", "nvidia_adjusted_operating_margin_pct",
      "nvidia_h20_adjustment_pp".

      Monetary values must be in millions. Percent and percentage-point values must be rounded to exactly 3 digits
      after the decimal point.
    ground_truth: '{"nvidia_revenue_2026_millions": 215938.000, "nvidia_operating_income_2026_millions": 130387.000, "nvidia_h20_charge_millions": 4500.000, "nvidia_adjusted_operating_income_millions": 134887.000, "nvidia_reported_operating_margin_pct": 60.382, "nvidia_adjusted_operating_margin_pct": 62.466, "nvidia_h20_adjustment_pp": 2.084}'

  - scenario: verification
    variant: verification_level_2_intel_sign_trap
    question: >
      Verification level 2: negative operating income and add-back sign trap.
      Use local document search/window tools to verify Intel's 2025 10-K evidence.
      Internally track extracted raw values and formulas, but return only the final JSON.

      A junior analyst produced this draft JSON:
      {"intel_revenue_2025_millions": 52853.000, "intel_operating_income_2025_millions": -2214.000,
      "intel_total_restructuring_charges_2025_millions": 2191.000,
      "intel_adjusted_operating_income_2025_millions": -4405.000,
      "intel_reported_operating_margin_2025_pct": -4.189,
      "intel_adjusted_operating_margin_2025_pct": -8.335,
      "intel_restructuring_adjustment_pp": -4.146}

      Verify the draft against the 10-K and correct it if needed.
      The restructuring and other charges were operating charges. For the adjusted operating margin, add back total
      restructuring and other charges to reported operating income/loss:
      adjusted operating income = reported operating income/loss + total restructuring and other charges.
      adjusted operating margin = adjusted operating income / revenue * 100.
      Adjustment in percentage points = adjusted operating margin minus reported operating margin.

      Return ONLY a valid JSON object with exact keys:
      "intel_revenue_2025_millions", "intel_operating_income_2025_millions",
      "intel_total_restructuring_charges_2025_millions",
      "intel_adjusted_operating_income_2025_millions",
      "intel_reported_operating_margin_2025_pct",
      "intel_adjusted_operating_margin_2025_pct",
      "intel_restructuring_adjustment_pp".

      Monetary values must be in millions and preserve negative signs.
      Percent and percentage-point values must be rounded to exactly 3 digits after the decimal point.
    ground_truth: '{"intel_revenue_2025_millions": 52853.000, "intel_operating_income_2025_millions": -2214.000, "intel_total_restructuring_charges_2025_millions": 2191.000, "intel_adjusted_operating_income_2025_millions": -23.000, "intel_reported_operating_margin_2025_pct": -4.189, "intel_adjusted_operating_margin_2025_pct": -0.044, "intel_restructuring_adjustment_pp": 4.145}'

  - scenario: verification
    variant: verification_level_3_apple_tax_reconciliation
    question: >
      Verification level 3: net income growth reconciliation with tax-effect adjustment.
      Use local document search/window tools to verify Apple's 2025 10-K evidence.
      Internally track extracted raw values and formulas, but return only the final JSON.

      A junior analyst produced this draft JSON:
      {"apple_net_income_2025_millions": 112010.000, "apple_net_income_2024_millions": 93736.000,
      "apple_state_aid_tax_effect_millions": 10700.000,
      "apple_reported_net_income_growth_pct": 19.495,
      "apple_adjusted_net_income_2025_millions": 122710.000,
      "apple_adjusted_net_income_growth_pct": 30.905,
      "apple_growth_effect_removed_pp": -11.410}

      Verify the draft against the 10-K and correct it if needed.
      Apple disclosed that its 2025 effective tax rate was lower compared with 2024 due to a $10.7 billion
      year-over-year decrease in provision for income taxes related to the State Aid Decision. To estimate net income
      growth excluding that favorable year-over-year tax effect, subtract 10.7 billion from 2025 net income, then
      calculate growth against 2024 net income:
      adjusted growth = (adjusted 2025 net income - 2024 net income) / 2024 net income * 100.
      Growth effect removed in percentage points = reported net income growth minus adjusted net income growth.

      Return ONLY a valid JSON object with exact keys:
      "apple_net_income_2025_millions", "apple_net_income_2024_millions",
      "apple_state_aid_tax_effect_millions",
      "apple_reported_net_income_growth_pct",
      "apple_adjusted_net_income_2025_millions",
      "apple_adjusted_net_income_growth_pct",
      "apple_growth_effect_removed_pp".

      Monetary values must be in millions. Percent and percentage-point values must be rounded to exactly 3 digits
      after the decimal point.
    ground_truth: '{"apple_net_income_2025_millions": 112010.000, "apple_net_income_2024_millions": 93736.000, "apple_state_aid_tax_effect_millions": 10700.000, "apple_reported_net_income_growth_pct": 19.495, "apple_adjusted_net_income_2025_millions": 101310.000, "apple_adjusted_net_income_growth_pct": 8.080, "apple_growth_effect_removed_pp": 11.415}'
