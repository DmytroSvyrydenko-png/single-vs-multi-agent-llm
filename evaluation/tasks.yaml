tasks:
  - scenario: context_pollution
    variant: apple
    question: >
      You have access to Apple's 2025 10-K report.
      Locate the information regarding unrecognized compensation cost related to outstanding RSUs.
      Extract two specific metrics as of September 27, 2025:
      1. The exact unrecognized compensation cost (in billions).
      2. The weighted-average period over which it is expected to be recognized (in years).
      Return ONLY a valid JSON with keys: "unrecognized_rsu_expense_billions", "weighted_avg_period_years".
      All values must be floating-point numbers representing plain decimal numbers with exactly 3 digits after the decimal point, using a period as separator.
      Do not include currency symbols, commas, or units (e.g., 1.111, 1111.000, -11.000).
    ground_truth: '{"unrecognized_rsu_expense_billions": 21.800, "weighted_avg_period_years": 2.500}'

  - scenario: context_pollution
    variant: microsoft
    question: >
      You have access to Microsoft's 10-K report for the fiscal year ended June 30, 2025.
      Your task is to locate and extract two specific, completely isolated metrics from different sections of the document:
      1. The exact number of registered holders of record of Microsoft's common stock as of July 24, 2025.
      2. The exact additional tax payment amount (in billions of dollars) that the IRS is seeking
      in the Notices of Proposed Adjustment (NOPAs) for the tax years 2004 to 2013.
      Return ONLY a valid JSON object with the exact keys: "registered_shareholders", "irs_proposed_tax_billions".
      All values must be floating-point numbers representing plain decimal numbers with exactly 3 digits after the decimal point, using a period as separator.
      Do not include currency symbols, commas, or units (e.g., 1.111, 1111.000, -11.000).
    ground_truth: '{"registered_shareholders": 77014.000, "irs_proposed_tax_billions": 28.900}'

  - scenario: context_pollution
    variant: nvidia
    question: >
      You have access to Nvidia's 10-K report for the fiscal year ended January 25, 2026.
      Your task is to locate and extract two highly specific metrics:
      1. The exact charge amount (in billions of dollars) incurred in the first quarter of fiscal year 2026
      associated with H20 excess inventory and purchase obligations due to U.S. government export requirements.
      2. The exact maximum gross exposure (in billions of dollars) under agreements entered into in fiscal year 2026
      to guarantee partners' facility lease obligations.
      Return ONLY a valid JSON object with the exact keys: "h20_inventory_charge_billions", "lease_guarantee_exposure_billions".
      All values must be floating-point numbers representing plain decimal numbers with exactly 3 digits after the decimal point, using a period as separator.
      Do not include currency symbols, commas, or units (e.g., 1.111, 1111.000, -11.000).
    ground_truth: '{"h20_inventory_charge_billions": 4.500, "lease_guarantee_exposure_billions": 3.500}'



  - scenario: parallelization
    variant: data_center
    companies: [AMD, Intel, Nvidia]
    question: >
      You have access to the 2025/2026 financial reports for AMD, Intel, and Nvidia.
      Find the exact revenue for their data center / compute segments for their latest reported fiscal year.
      Specifically, extract:
      1. AMD's "Data Center" net revenue for 2025.
      2. Intel's "DCAI" (Data Center and AI) revenue for 2025.
      3. Nvidia's "Compute & Networking" revenue for the fiscal year ended January 25, 2026.
      Return your response ONLY as a valid JSON object with the exact keys: "AMD_Data_Center", "Intel_DCAI", "Nvidia_Compute_Networking".
      Report all figures in millions.
      All values must be floating-point numbers representing plain decimal numbers with exactly 3 digits after the decimal point, using a period as separator.
      Do not include currency symbols, commas, or units (e.g., 1.111, 1111.000, -11.000).
    ground_truth: '{"AMD_Data_Center": 16635.000, "Intel_DCAI": 16919.000, "Nvidia_Compute_Networking": 193479.000}'

  - scenario: parallelization
    variant: rnd
    companies: [Apple, Microsoft, Nvidia]
    question: >
      You have access to the financial reports for Apple, Microsoft, and Nvidia.
      Find the exact Research and Development (R&D) expenses for their latest reported fiscal year.
      Specifically, extract:
      1. Apple's "Research and development" expense for the fiscal year ended September 27, 2025.
      2. Microsoft's "Research and development" expense for the fiscal year ended June 30, 2025.
      3. Nvidia's "Research and development" expense for the fiscal year ended January 25, 2026.
      Return your response ONLY as a valid JSON object with the exact keys: "Apple_RnD", "Microsoft_RnD", "Nvidia_RnD".
      Report all figures in millions.
      All values must be floating-point numbers representing plain decimal numbers with exactly 3 digits after the decimal point, using a period as separator.
      Do not include currency symbols, commas, or units (e.g., 1.111, 1111.000, -11.000).
    ground_truth: '{"Apple_RnD": 34550.000, "Microsoft_RnD": 32488.000, "Nvidia_RnD": 18497.000}'

  - scenario: parallelization
    variant: total_revenue
    companies: [Apple, Microsoft, AMD]
    question: >
      You have access to the financial reports for Apple, Microsoft, and AMD.
      Find the exact total top-line revenue for their latest reported fiscal year.
      Specifically, extract:
      1. Apple's "Total net sales" for the fiscal year 2025.
      2. Microsoft's "Total revenue" for the fiscal year 2025.
      3. AMD's "Total net revenue" for the fiscal year 2025.
      Return your response ONLY as a valid JSON object with the exact keys: "Apple_Total_Sales", "Microsoft_Total_Revenue", "AMD_Total_Revenue".
      Report all figures in millions.
      All values must be floating-point numbers representing plain decimal numbers with exactly 3 digits after the decimal point, using a period as separator.
      Do not include currency symbols, commas, or units (e.g., 1.111, 1111.000, -11.000).
    ground_truth: '{"Apple_Total_Sales": 416161.000, "Microsoft_Total_Revenue": 281724.000, "AMD_Total_Revenue": 34639.000}'



  - scenario: verification
    variant: apple_tax
    question: >
      You have access to Apple's 10-K report.
      Create a strict JSON breakdown of Apple's Provision for Income Taxes for the fiscal year 2024.
      Extract exactly three specific values from the income tax provision table:
      1. Current Federal tax
      2. Deferred Federal tax
      3. Current Foreign tax
      All figures must be exactly as reported in the 2024 column in millions.
      Return ONLY a valid JSON with keys: "current_federal_tax_2024", "deferred_federal_tax_2024", "current_foreign_tax_2024".
      All values must be floating-point numbers representing plain decimal numbers with exactly 3 digits after the decimal point, using a period as separator.
      Do not include currency symbols, commas, or units (e.g., 1.111, 1111.000, -11.000).
    ground_truth: '{"current_federal_tax_2024": 5571.000, "deferred_federal_tax_2024": -3080.000, "current_foreign_tax_2024": 25483.000}'

  - scenario: verification
    variant: intel_litigation
    question: >
      You have access to Intel's 10-K report.
      Locate the table detailing "Restructuring and other charges".
      Extract the exact figures for the "Litigation charges and other" category
      for the years ended Dec 27, 2025, and Dec 30, 2023.
      All figures must be exactly as reported in millions.
      Return ONLY a valid JSON with keys: "litigation_charges_2025", "litigation_charges_2023".
      All values must be floating-point numbers representing plain decimal numbers with exactly 3 digits after the decimal point, using a period as separator.
      Do not include currency symbols, commas, or units (e.g., 1.111, 1111.000, -11.000).
    ground_truth: '{"litigation_charges_2025": -121.000, "litigation_charges_2023": -329.000}'

  - scenario: verification
    variant: microsoft_income
    question: >
      You have access to Microsoft's 10-K report.
      Locate the table detailing the components of "other income (expense), net".
      Extract exactly three values for the Year Ended June 30, 2025:
      1. Interest expense
      2. Net recognized losses on investments
      3. Net gains (losses) on foreign currency remeasurements
      All figures must be exactly as reported in millions.
      Return ONLY a valid JSON with keys: "interest_expense_2025", "net_losses_investments_2025", "net_gains_foreign_currency_2025".
      All values must be floating-point numbers representing plain decimal numbers with exactly 3 digits after the decimal point, using a period as separator.
      Do not include currency symbols, commas, or units (e.g., 1.111, 1111.000, -11.000).
    ground_truth: '{"interest_expense_2025": -2385.000, "net_losses_investments_2025": -349.000, "net_gains_foreign_currency_2025": 171.000}'
