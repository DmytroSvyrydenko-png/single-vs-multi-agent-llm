  - scenario: parallelization
    variant: margin_change_3_companies
    companies: [Apple, Microsoft, Nvidia]
    question: >
      Parallelization level 1.
      You have access to the latest 10-K reports for exactly 3 companies:
      Apple, Microsoft, and Nvidia.

      Company numeric codes:
      Apple=1, Microsoft=2, Nvidia=3.

      For every company, independently extract revenue and operating income for the latest fiscal year and the
      immediately prior fiscal year. Calculate operating margin for both years:
      operating margin = operating income / revenue * 100.
      Then calculate operating margin change in percentage points:
      latest-year operating margin minus prior-year operating margin.

      Return ONLY a valid JSON object with exact keys:
      "company_count",
      "highest_improvement_company_code",
      "highest_improvement_pp",
      "lowest_change_company_code",
      "lowest_change_pp",
      "average_margin_change_pp".

      Percentage-point values must be signed percentage points, not relative percent growth.
      All values must be floating-point numbers rounded to exactly 3 digits after the decimal point.
    ground_truth: '{"company_count": 3.000, "highest_improvement_company_code": 2.000, "highest_improvement_pp": 0.978, "lowest_change_company_code": 3.000, "lowest_change_pp": -2.036, "average_margin_change_pp": -0.199}'

