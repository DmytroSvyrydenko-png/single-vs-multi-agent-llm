      All values must be floating-point numbers rounded to exactly 3 digits after the decimal point.
    ground_truth: '{"company_count": 5.000, "highest_improvement_company_code": 5.000, "highest_improvement_pp": 17.803, "lowest_change_company_code": 3.000, "lowest_change_pp": -2.036, "average_margin_change_pp": 4.100}'

