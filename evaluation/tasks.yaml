tasks:
  - scenario: context_pollution
    variant: tax_uncertainty_3_documents
    question: >
      Context-pollution level 1.
      Use the full-document reader and inspect exactly these local full-text 10-K documents, one company at a time:
      Adobe, Alphabet, and Amazon.

      Company numeric codes for rank fields:
      Adobe=1, Alphabet=2, Amazon=3.

      For each company, find whether the latest fiscal year's income tax disclosure includes an actual ending balance
      of gross unrecognized tax benefits, gross tax contingencies, or an equivalent total gross unrecognized tax
      benefits amount. Use only actual ending balances from income tax disclosures. Exclude narrative-only risk
      disclosures, proposed IRS adjustments, accrued interest and penalties, and amounts that would affect the
      effective tax rate.

      Return ONLY a valid JSON object with exact keys:
      "document_count",
      "matching_company_count",
      "total_gross_unrecognized_tax_benefits_millions",
      "largest_company_code",
      "largest_amount_millions",
      "smallest_company_code",
      "smallest_amount_millions".

      Monetary values must be in millions. Rank fields must use the numeric company codes above.
      All values must be floating-point numbers with exactly 3 digits after the decimal point.
    ground_truth: '{"document_count": 3.000, "matching_company_count": 3.000, "total_gross_unrecognized_tax_benefits_millions": 18771.000, "largest_company_code": 2.000, "largest_amount_millions": 11512.000, "smallest_company_code": 1.000, "smallest_amount_millions": 693.000}'

